name: Deploy - Cloudflare Pages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

env:
  # Baked into prerendered HTML, sitemap.xml and robots.txt at build time.
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://nat-checker.kkcloud.org' }}
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'nat-checker' }}
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || 'nat-checker.kkcloud.org' }}
  ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME || 'kkcloud.org' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint
        run: pnpm typecheck && pnpm run lint

      - name: Test detection engine
        run: pnpm test

      - name: Build static site
        run: pnpm build

      - name: Prepare Pages project, custom domain and DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/cloudflare-attach-domain.sh

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Always deploy as the production branch so a tag (or a manual run)
          # becomes the live site instead of a preview deployment.
          command: >-
            pages deploy apps/web/dist/client
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-message="${{ github.ref_name }}"
            --commit-dirty=false

      - name: Deployment summary
        run: |
          echo "### ☁️ Deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production:** https://${{ env.CUSTOM_DOMAIN }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VITE_SITE_URL:** \`${{ env.VITE_SITE_URL }}\`" >> $GITHUB_STEP_SUMMARY
