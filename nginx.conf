# Runtime config for the prerendered TanStack Start build.
#
# Copied to /etc/nginx/conf.d/default.conf, so the base image's nginx.conf
# (worker/user settings, mime types, log formats) is left untouched.

server {
    listen      5173;
    listen      [::]:5173;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Unknown paths serve the prerendered 404 page with a 404 status.
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    # Hashed build output — safe to cache forever.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # "/" is the static language redirector (public/index.html), and
    # "<locale>" / "<locale>/nat-types" resolve through the index.html
    # fallback, so "/zh" is served without a trailing-slash redirect.
    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/index.html $uri.html =404;
    }

    location = /404.html {
        internal;
    }
}
